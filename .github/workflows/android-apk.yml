name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APK_PATH: src/android/app/build/outputs/apk/debug/app-debug.apk
  DIST_APK: dist/OpenMinis-latest.apk
  NDK_VERSION: 28.0.12433566

jobs:
  build-apk:
    name: Build and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            src/android/*.gradle.kts
            src/android/gradle/wrapper/gradle-wrapper.properties
            src/android/app/build.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          test -x "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl make tar unzip zip file python3

      - name: Prepare public build customization
        shell: bash
        run: |
          set -euo pipefail
          cp src/android/app/provider-customization.properties.example \
             src/android/app/provider-customization.properties
          chmod +x \
            deps/build_proot.sh \
            scripts/prepare_android_sandbox.sh \
            scripts/gen_debug_skill_android.sh \
            src/android/gradlew

      - name: Build PRoot and loaders
        shell: bash
        run: |
          set -euo pipefail
          ./deps/build_proot.sh
          test -s src/android/app/src/main/assets/proot-aarch64
          test -s src/android/app/src/main/jniLibs/arm64-v8a/libproot.so
          test -s src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          test -s src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader32.so

      - name: Prepare Alpine sandbox
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/prepare_android_sandbox.sh
          test -s src/android/app/src/main/assets/alpine-minirootfs.tar.gz

      - name: Build debug APK
        working-directory: src/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK is real and installable
        shell: bash
        run: |
          set -euo pipefail
          APK="$APK_PATH"

          echo "Checking APK path: $APK"
          test -f "$APK"
          test -s "$APK"

          # APK is a ZIP container. Fail on any CRC/truncation problem.
          unzip -tq "$APK"

          # Verify the APK signature generated by the Android debug signing config.
          APKSIGNER="$(find "${ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

          # A successful Gradle task is not enough for OpenMinis: the Linux
          # sandbox must actually be present in the produced APK.
          ZIP_LIST="$(unzip -Z1 "$APK")"
          for required in \
            "assets/proot-aarch64" \
            "assets/alpine-minirootfs.tar.gz" \
            "lib/arm64-v8a/libproot.so" \
            "lib/arm64-v8a/libproot-loader.so" \
            "lib/arm64-v8a/libproot-loader32.so"; do
            echo "$ZIP_LIST" | grep -Fx "$required" >/dev/null || {
              echo "Missing required APK payload: $required" >&2
              exit 1
            }
          done

          mkdir -p dist
          cp "$APK" "$DIST_APK"
          sha256sum "$DIST_APK" > "${DIST_APK}.sha256"

          echo "Verified APK:"
          file "$DIST_APK"
          du -h "$DIST_APK"
          cat "${DIST_APK}.sha256"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenMinis-Android-APK
          path: |
            dist/OpenMinis-latest.apk
            dist/OpenMinis-latest.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete ci-latest --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create ci-latest \
            dist/OpenMinis-latest.apk \
            dist/OpenMinis-latest.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "OpenMinis Android · Latest CI Build" \
            --notes "Automatically built and verified from main at commit $GITHUB_SHA. The workflow validates ZIP integrity, APK signature, PRoot, ELF loaders, and the Alpine rootfs before publishing."

      - name: Publish download page branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SITE_DIR="$(mktemp -d)"
          cp website/index.html "$SITE_DIR/index.html"
          cp dist/OpenMinis-latest.apk.sha256 "$SITE_DIR/OpenMinis-latest.apk.sha256"
          touch "$SITE_DIR/.nojekyll"

          cd "$SITE_DIR"
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "site: publish verified Android build $GITHUB_SHA"
          git remote add origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
